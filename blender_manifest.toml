schema_version = "1.0.0"
id = "zan_node_gems"
version = "5.4.0"
name = "Zan's Node Gems"
tagline = "A collection of node utilities"
maintainer = "Daniel Salazar"
type = "asset-library"
blender_version_min = "5.3.0"
license = [
  "SPDX-License-Identifier: CC0-1.0"
]

website = "https://blenderaddon.com/"

tags = ["Geometry Nodes", "Shading"]

[asset_library]
remote_url = "https://assets.blenderaddon.com/"

[build]
paths_exclude_pattern = [
  "*.blend",
  "*_thumbnails/",
  "_v1/",
  "*.json",
  "*.txt",
  "CNAME",
  ".nojekyll",
  ".git/",
  ".gitignore",
  "*~"
]